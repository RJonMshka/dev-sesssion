name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # gitleaks-action enumerates PR commits via the API to scan them.
  pull-requests: read

jobs:
  ci:
    name: Typecheck / Lint / Test / Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks scans the pushed commit range on `push` events; a shallow
          # clone cannot resolve <before>^..<after>, so fetch full history.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Security audit (prod deps)
        run: npm audit --omit=dev
        continue-on-error: true

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          # gitleaks-action@v2 requires GITHUB_TOKEN to scan pull requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Build
        run: pnpm build

      - name: Test + coverage gate
        run: pnpm test:coverage

      - name: Eval harness tests
        run: pnpm test:evals

      # Drives the *published* CLI, so it needs no workspace build and no API
      # key. ~40s. Deliberately not continue-on-error: the audit step above
      # shows what a gate that cannot fail is worth.
      - name: Eval — deterministic tier
        run: pnpm eval

      # The adversarial corpus (REQ-EVAL-6) gates *this* build: against a
      # release, a fixed break would stay red until the fix shipped. Packs the
      # workspace build and installs the tarball, as eval:units does. ~60s.
      - name: Eval — adversarial corpus
        run: pnpm eval --local

      # Packs *this* build (code units are unreleased) and installs the tarball,
      # so packaging defects still reproduce. Hash fidelity over every unit,
      # Focus grounding, manifest/prompt agreement, stale detection. ~15s.
      - name: Eval — code units
        run: pnpm eval:units

      - name: Publint
        run: pnpm publint
